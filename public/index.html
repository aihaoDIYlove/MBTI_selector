<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name='description' content='一个可以帮助你快速填写mbti喜好表格的网页应用，表格由 小林鸭西 制作。图片相关的的一切版权归属原作者所有。'>
    <title>mbti.dreamripples.icu</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico">
    <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico">
    <script src="libs/html2canvas.min.js"></script>
</head>
<link rel="stylesheet" href="css/main.css?v=e0cbd5f8">
<body>
    <h1 id="title">mbti喜好表格填写器 (∠・ω &lt; )⌒☆</h1>

    <div id="main-card">
        <div id="img-container">
            <div class="matrix" id="matrix-container">
                <div class="matrix-element" id="matrix-0-0"></div>
                <div class="matrix-element" id="matrix-0-1"></div>
                <div class="matrix-element" id="matrix-0-2"></div>
                <div class="matrix-element" id="matrix-0-3"></div>
                <div class="matrix-element" id="matrix-1-0"></div>
                <div class="matrix-element" id="matrix-1-1"></div>
                <div class="matrix-element" id="matrix-1-2"></div>
                <div class="matrix-element" id="matrix-1-3"></div>
                <div class="matrix-element" id="matrix-2-0"></div>
                <div class="matrix-element" id="matrix-2-1"></div>
                <div class="matrix-element" id="matrix-2-2"></div>
                <div class="matrix-element" id="matrix-2-3"></div>
                <div class="matrix-element" id="matrix-3-0"></div>
                <div class="matrix-element" id="matrix-3-1"></div>
                <div class="matrix-element" id="matrix-3-2"></div>
                <div class="matrix-element" id="matrix-3-3"></div>
            </div>
            <div id="list-container">
                <div class="list-element" id="list-0"></div>
                <div class="list-element" id="list-1"></div>
                <div class="list-element" id="list-2"></div>
                <div class="list-element" id="list-3"></div>
                <div class="list-element" id="list-4"></div>
                <div class="list-element" id="list-5"></div>
            </div>
            <img src="img/img.webp" alt="1" id="img-1">
        </div>
        <div class="button-container" id="button-container">
            <div id="color-indication"></div>
            <button id="reset-button">重置颜色</button>
            <button id="generate-button">生成图片</button>
        </div>
        <h2 class="prompt-text">*请点击右侧颜色选中一个颜色后，点击人物图标</h2>
        <h2 class="prompt-text">*微信和QQ内置的浏览器会拦截下载请求，请使用浏览器打开</h2>
        <h2 class="prompt-text">联系邮箱：hello@dreamripples.icu</h2>
    </div>
    <div id="information-container">
        <div class="information-item">
            <h3 class="information" id="information-1">表格作者：小林鸭西</h3>
            <a class="link" href="https://v.douyin.com/ZIBkZ2DSqCI/">抖音主页：v.douyin.com/ZIBkZ2DSqCI</a>
            <h3 class="information" id="information-4">*本网页不会以任何形式(包括捐赠、广告等)盈利;由本站生成的任何图片版权均归属于原作者</h3>
        </div>
    </div>
    <script src="js/main.js?v=55c14fc5"></script>
</body>
</html>
