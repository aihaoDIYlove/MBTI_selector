<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="css/img.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/hammer.js/2.0.8/hammer.min.js"></script>
    <title>图片编辑器</title>
</head>
<body>
    <h1 id="title-text">图片编辑器 (∠・ω &lt; )⌒☆</h1>
    <div id="text-box">
        <!-- 这里根据实际状态改变，比如“涂鸦模式”、“文字模式”、“橡皮模式”等等
         移动模式时，可根据手势放大缩小 -->
        <h2 id="status">移动模式</h2>
    </div>
    <div id="img-box">
        <!-- 这里是画布容器的位置，图片在这里编辑 -->
        <canvas id="image-canvas"></canvas>
    </div>
    <div>
        <div id="function-button-box">
            <button id="move-button" title="移动&缩放模式">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M5 9l-3 3 3 3M9 5l3-3 3 3M15 19l-3 3-3-3M19 9l3 3-3 3M2 12h20M12 2v20"/>
                </svg>
            </button>
            <button id="graffiti-button" title="涂鸦">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                    <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                    <path d="M2 2l7.586 7.586"/>
                </svg>
            </button>
            <button id="rubber-button" title="橡皮擦">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 20H7l-4-4a1 1 0 010-1.414l9-9a1 1 0 011.414 0l7 7a1 1 0 010 1.414l-4 4z"/>
                    <path d="M18 11l-7 7"/>
                </svg>
            </button>
            <button id="text-button" title="文字">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="4 7 4 4 20 4 20 7"/>
                    <line x1="9" y1="20" x2="15" y2="20"/>
                    <line x1="12" y1="4" x2="12" y2="20"/>
                </svg>
            </button>
            <button id="revoke-button" title="撤销">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 10h10a5 5 0 015 5v0a5 5 0 01-5 5H9"/>
                    <polyline points="3 10 7 6 3 10 7 14"/>
                </svg>
            </button>
        </div>
    </div>
    <div id="Brush-box">
        <!-- 这个容器用来在涂鸦模式调整画笔粗细和颜色，固定在页面底部 -->
    </div>
    <div id="generate-button-box">
        <button id="reset-button">重置画布</button>
        <button id="generate-button">下载图片</button>
    </div>

<script src="js/img.js"></script>
</body>
</html>
